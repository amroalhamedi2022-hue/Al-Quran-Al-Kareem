name: Stage official Hafs Mushaf artwork (UNAPPROVED)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/official-source-staging.yml'
      - 'scripts/stage_official_hafs.py'
      - 'scripts/tests/test_official_stage.py'
      - 'scripts/render_staged_hafs.py'
      - 'scripts/validate_png.py'
      - 'scripts/audit_render_archive.py'
      - 'scripts/tests/test_render_archive_audit.py'
      - 'scripts/audit_rendered_pages.py'
      - 'scripts/tests/test_raster_audit.py'
permissions:
  contents: read
  issues: write
jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source archive gate with synthetic non-Quran fixtures
        run: python -m unittest scripts/tests/test_official_stage.py -v
      - name: Download official Hafs AI archive with three integrity-checked sources
        id: download
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/official-hafs.zip"
          expected='280c5d71ca16aaeeb3a343be1b92c76fa6df71d0671e202c026fde12402d9eef'
          expected_size=466430736
          urls=(
            'https://dm.qurancomplex.gov.sa/Download/1441-AI-hafs.zip'
            'https://archive.org/download/MushafMadinaHafsGreen1441/1441-AI-hafs.zip'
            'https://cdn.quran.ws/KFGQPC/resources/dm/1441-ai-hafs/1441-AI-hafs.zip'
          )
          verified=0
          for url in "${urls[@]}"; do
            echo "Trying source: $url"
            if curl --fail --location --retry 2 --retry-delay 6 --connect-timeout 25 --max-time 1800 --output "$archive" "$url"; then
              actual_size="$(stat -c%s "$archive")"
              if [ "$actual_size" -eq "$expected_size" ] && echo "$expected  $archive" | sha256sum --check -; then
                verified=1
                echo "Official publisher hash VERIFIED for $url"
                break
              fi
              echo "::warning::Downloaded source has wrong size or hash, trying another source."
            else
              echo "::warning::Download failed from source, trying another."
            fi
            rm -f "$archive"
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::No download matched the original publisher's pinned SHA256 and size"
            exit 1
          fi
      - name: Stage 604 original AI pages (never release or certify)
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_official_hafs.py \
            --archive "$RUNNER_TEMP/official-hafs.zip" \
            --out-dir "$RUNNER_TEMP/hafs-stage"
          mkdir -p previews
          cp "$RUNNER_TEMP/hafs-stage/SOURCE_STAGE_ONLY.json" previews/SOURCE_STAGE_ONLY.json
      - name: Install vector renderer for preview only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
      - name: Render 4 sample PNGs for human approval (NOT Quran release)
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          for page in 001 002 003 604; do
            inkscape "$RUNNER_TEMP/hafs-stage/$page.ai" \
              --export-filename="$GITHUB_WORKSPACE/previews/$page.png" \
              --export-width=1600
          done
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from validate_png import validate_png
          for p in sorted(Path('previews').glob('*.png')):
              print(p, validate_png(p))
          assert len(list(Path('previews').glob('*.png'))) == 4
          PY
      - name: Upload only sample previews and source report, explicitly unapproved
        uses: actions/upload-artifact@v4
        with:
          name: UNAPPROVED-official-Hafs-preview
          path: previews/
          retention-days: 14
          if-no-files-found: error

      - name: Convert all 604 pages for independent review (UNAPPROVED, NOT APP ASSETS)
        id: render_all
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_staged_hafs.py \
            --stage-dir "$RUNNER_TEMP/hafs-stage" \
            --out-dir "$GITHUB_WORKSPACE/unapproved-pages" \
            --width 1600
          test "$(find unapproved-pages -maxdepth 1 -name '*.png' | wc -l)" -eq 604
      - name: Full pixel-decode and margin audit of all 604 pages (NOT APPROVAL)
        id: technical_audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow==11.3.0'
          python -m unittest scripts/tests/test_raster_audit.py -v
          python scripts/audit_rendered_pages.py \
            --source "$GITHUB_WORKSPACE/unapproved-pages" \
            --out "$RUNNER_TEMP/TECHNICAL_AUDIT_ONLY.json"
          cp "$RUNNER_TEMP/TECHNICAL_AUDIT_ONLY.json" "$GITHUB_WORKSPACE/unapproved-pages/"
      - name: Audit complete 604-page render archive (UNAPPROVED)
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          from tempfile import gettempdir
          import os
          root = Path('unapproved-pages')
          archive = Path(os.environ['RUNNER_TEMP']) / 'quran-604-review.zip'
          with ZipFile(archive, 'w', compression=ZIP_STORED, allowZip64=True) as zipped:
              for file in sorted(root.iterdir()):
                  if file.is_file():
                      zipped.write(file, file.name)
          print('Created unapproved review archive:', archive, archive.stat().st_size)
          PY
          mkdir -p technical-audit
          python scripts/audit_render_archive.py \
            --archive "$RUNNER_TEMP/quran-604-review.zip" \
            --output technical-audit/TECHNICAL_AUDIT.json
      - name: Upload technical audit separately from original page images
        uses: actions/upload-artifact@v4
        with:
          name: UNAPPROVED-604-technical-audit
          path: technical-audit/TECHNICAL_AUDIT.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload all 604 UNAPPROVED PNG pages for review (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: UNAPPROVED-Hafs-604-PNG-for-human-review
          path: unapproved-pages/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error

      - name: Publish machine-verifiable run outcome in source review issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DOWNLOAD: ${{ steps.download.outcome }}
          SOURCE_STAGE: ${{ steps.stage.outcome }}
          SAMPLE_PREVIEW: ${{ steps.preview.outcome }}
          ALL_604_RENDER: ${{ steps.render_all.outcome }}
          COMPLETE_ARCHIVE_AUDIT: ${{ steps.audit.outcome }}
          TECHNICAL_AUDIT: ${{ steps.technical_audit.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Official Hafs source pipeline result"
            echo
            echo "- GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Official-source byte-for-byte download: **$SOURCE_DOWNLOAD**"
            echo "- 604 AI originals staging: **$SOURCE_STAGE**"
            echo "- Four page samples: **$SAMPLE_PREVIEW**"
            echo "- All 604 rendered PNG for independent review: **$ALL_604_RENDER**"
            echo "- Independent full-output structural + SHA audit: **$COMPLETE_ARCHIVE_AUDIT**"
            echo "- Full PNG decode/alpha margin/hash technical audit: **$TECHNICAL_AUDIT**"
            echo
            echo "This is an automated integrity/conversion report ONLY. No scholarly approval or release."
          } > "$RUNNER_TEMP/source-report.md"
          gh issue comment 8 --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/source-report.md"
