name: source-and-android-quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Enforce offline source policy
        run: python scripts/verify_offline.py --manifest app/src/main/AndroidManifest.xml --sources app
      - name: Do not publish an unapproved Quran pack
        run: |
          if [ -f app/src/main/assets/quran/approved_manifest.json ]; then
            python scripts/verify_quran_pack.py \
              --pages app/src/main/assets/quran \
              --manifest app/src/main/assets/quran/approved_manifest.json
          else
            echo "PASS (scaffold only): no Quran pack; NO RELEASE allowed."
          fi
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug scaffold (not a verified Quran release)
        run: gradle --no-daemon :app:assembleDebug
