name: source-and-android-quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install technical image audit dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Run fail-closed unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Enforce offline source policy
        run: python scripts/verify_offline.py --manifest app/src/main/AndroidManifest.xml --sources app
      - name: Reject unreviewed Quran pack
        run: |
          if [ -f app/src/main/assets/quran/approved_manifest.json ]; then
            python scripts/verify_quran_pack.py \
              --pages app/src/main/assets/quran \
              --manifest app/src/main/assets/quran/approved_manifest.json
            python scripts/verify_approval_seal.py \
              --kotlin app/src/main/java/app/alquran/kareem/QuranAssetVerifier.kt \
              --manifest app/src/main/assets/quran/approved_manifest.json
          else
            echo "PASS (scaffold only): no approved Quran pack; NO RELEASE allowed."
          fi
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub runner already provides the Android command-line SDK. The old
      # setup-android action attempts to install the removed legacy "tools"
      # package and fails on the November 2026 command-line manager.
      - name: Install Android 36 platform using preinstalled sdkmanager
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug scaffold (not a verified Quran release)
        run: gradle --no-daemon :app:assembleDebug
      - name: Run native reader pagination tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Check debug APK does not request Internet
        shell: bash
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/app-permissions.txt
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE)' /tmp/app-permissions.txt; then
            echo "FAILED: network permission found in built APK"
            exit 1
          fi
          echo "PASS: no declared network permissions in debug APK"
